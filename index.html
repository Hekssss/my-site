<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой первый сайт</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1e1b4b, #4c1d95);
      color: #f5f3ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 560px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(8px);
    }
    .avatar {
      width: 96px; height: 96px;
      border-radius: 50%;
      background: #a78bfa;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; margin: 0 auto 20px;
    }
    h1 { font-size: 32px; margin-bottom: 8px; }
    .role { color: #c4b5fd; margin-bottom: 24px; }
    p { line-height: 1.6; margin-bottom: 24px; }
    .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .links a {
      color: #1e1b4b; background: #f5f3ff;
      padding: 10px 20px; border-radius: 999px;
      text-decoration: none; font-weight: 600;
    }
    .links a:hover { background: #c4b5fd; }
    footer { margin-top: 32px; font-size: 13px; color: #a5b4fc; }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar"></div>
    <h1>Даниил Гайворонский</h1>
    <div class="role">Студент учусь делать сайты</div>
    <p>Мой первый сайт на Github и Vercel
       за 20 минут.</p>
    <div class="links">
      <a href="https://github.com/" target="_blank">GitHub</a>
      <a href="mailto:me@example.com">Написать мне</a>
    </div>
  </div>
</body>
</html>
